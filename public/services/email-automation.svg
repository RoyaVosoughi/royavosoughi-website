<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Daily email report automation</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0047AB"/>
    </marker>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#1E1E1E" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1200" height="560" rx="28" fill="#F5EBE0"/>

  <!-- Step labels -->
  <g font-size="13" font-weight="600" letter-spacing="2" fill="#0047AB">
    <text x="60" y="78">01 · TRIGGER</text>
    <text x="330" y="78">02 · AGENT</text>
    <text x="600" y="78">03 · SORT</text>
    <text x="870" y="78">04 · REPORT</text>
  </g>

  <!-- 1. Schedule -->
  <g filter="url(#soft)">
    <rect x="40" y="100" width="230" height="300" rx="22" fill="#FFFBF6" stroke="#1E1E1E" stroke-opacity="0.1"/>
  </g>
  <circle cx="155" cy="190" r="44" fill="#0047AB"/>
  <circle cx="155" cy="190" r="30" fill="none" stroke="#F5EBE0" stroke-width="4"/>
  <path d="M155 172 V190 L168 200" fill="none" stroke="#F5EBE0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="155" y="275" text-anchor="middle" font-size="22" font-weight="700" fill="#1E1E1E">Every morning</text>
  <text x="155" y="305" text-anchor="middle" font-size="15" fill="#1E1E1E" fill-opacity="0.65">A scheduled task</text>
  <text x="155" y="326" text-anchor="middle" font-size="15" fill="#1E1E1E" fill-opacity="0.65">starts on its own,</text>
  <text x="155" y="347" text-anchor="middle" font-size="15" fill="#1E1E1E" fill-opacity="0.65">no click needed</text>

  <!-- 2. Agent -->
  <g filter="url(#soft)">
    <rect x="310" y="100" width="230" height="300" rx="22" fill="#1E1E1E"/>
  </g>
  <circle cx="425" cy="190" r="44" fill="#0047AB"/>
  <path d="M425 160 C428 180 435 187 455 190 C435 193 428 200 425 220 C422 200 415 193 395 190 C415 187 422 180 425 160 Z" fill="#F5EBE0"/>
  <text x="425" y="275" text-anchor="middle" font-size="22" font-weight="700" fill="#F5EBE0">AI agent</text>
  <text x="425" y="305" text-anchor="middle" font-size="15" fill="#F5EBE0" fill-opacity="0.7">Connected to your</text>
  <text x="425" y="326" text-anchor="middle" font-size="15" fill="#F5EBE0" fill-opacity="0.7">inbox, reads every</text>
  <text x="425" y="347" text-anchor="middle" font-size="15" fill="#F5EBE0" fill-opacity="0.7">new email</text>

  <!-- 3. Sort -->
  <g filter="url(#soft)">
    <rect x="580" y="100" width="230" height="300" rx="22" fill="#FFFBF6" stroke="#1E1E1E" stroke-opacity="0.1"/>
  </g>
  <rect x="615" y="140" width="160" height="40" rx="20" fill="#0047AB"/>
  <text x="695" y="166" text-anchor="middle" font-size="15" font-weight="600" fill="#FFFFFF">Urgent</text>
  <rect x="615" y="192" width="160" height="40" rx="20" fill="#1E1E1E"/>
  <text x="695" y="218" text-anchor="middle" font-size="15" font-weight="600" fill="#F5EBE0">Needs a reply</text>
  <rect x="615" y="244" width="160" height="40" rx="20" fill="none" stroke="#1E1E1E" stroke-opacity="0.35" stroke-width="1.5"/>
  <text x="695" y="270" text-anchor="middle" font-size="15" font-weight="600" fill="#1E1E1E" fill-opacity="0.75">Just FYI</text>
  <text x="695" y="326" text-anchor="middle" font-size="15" fill="#1E1E1E" fill-opacity="0.65">Decides what matters</text>
  <text x="695" y="347" text-anchor="middle" font-size="15" fill="#1E1E1E" fill-opacity="0.65">and what can wait</text>

  <!-- 4. Report -->
  <g filter="url(#soft)">
    <rect x="850" y="100" width="310" height="300" rx="22" fill="#FFFBF6" stroke="#0047AB" stroke-width="2"/>
  </g>
  <text x="880" y="145" font-size="19" font-weight="700" fill="#1E1E1E">Your daily email report</text>
  <line x1="880" y1="162" x2="1130" y2="162" stroke="#1E1E1E" stroke-opacity="0.12"/>
  <circle cx="890" cy="190" r="6" fill="#0047AB"/>
  <text x="906" y="196" font-size="15" fill="#1E1E1E"><tspan font-weight="700">2 urgent</tspan> · client question, invoice</text>
  <circle cx="890" cy="224" r="6" fill="#1E1E1E"/>
  <text x="906" y="230" font-size="15" fill="#1E1E1E"><tspan font-weight="700">4 need a reply</tspan> · who and why</text>
  <circle cx="890" cy="258" r="6" fill="none" stroke="#1E1E1E" stroke-opacity="0.5" stroke-width="1.5"/>
  <text x="906" y="264" font-size="15" fill="#1E1E1E"><tspan font-weight="700">11 FYI</tspan> · summed up in one line</text>
  <rect x="880" y="292" width="250" height="10" rx="5" fill="#1E1E1E" fill-opacity="0.08"/>
  <rect x="880" y="312" width="200" height="10" rx="5" fill="#1E1E1E" fill-opacity="0.08"/>
  <text x="880" y="368" font-size="15" fill="#0047AB" font-weight="600">Read it in 2 minutes →</text>

  <!-- Arrows -->
  <g stroke="#0047AB" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
    <line x1="272" y1="250" x2="304" y2="250"/>
    <line x1="542" y1="250" x2="574" y2="250"/>
    <line x1="812" y1="250" x2="844" y2="250"/>
  </g>

  <!-- Bottom line -->
  <text x="600" y="480" text-anchor="middle" font-size="24" font-weight="600" fill="#1E1E1E">No more scrolling through the inbox. One short report, every day.</text>
</svg>
